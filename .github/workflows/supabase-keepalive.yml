# Mantiene vivo el proyecto Supabase "alergiguard" (tabla gift_codes).
#
# El plan gratuito de Supabase pausa los proyectos que pasan ~7 dias sin
# actividad. Si eso ocurre, los codigos de regalo (APCEQUIPA, PORTUGAL2026...)
# dejan de validarse en la app, porque desde la 1.0.32 se comprueban en remoto
# contra la funcion RPC `redeem_gift_code`.
#
# Sustituye al script local scripts/supabase_keepalive.ps1 del repo de la app,
# que solo hacia ping cuando el PC estaba encendido y con red.
#
# La clave vive en el secreto SUPABASE_KEEPALIVE_KEY del repo. Es la
# publishable key: publica por diseno (viaja dentro del APK/IPA) y RLS protege
# los datos. Esta como secreto solo para no dejarla indexable en un repo publico.

name: Supabase keepalive

on:
  schedule:
    # Cada 2 dias a las 05:00 UTC. Margen de sobra frente al limite de ~7 dias.
    - cron: '0 5 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la tabla gift_codes
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEEPALIVE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Falta el secreto SUPABASE_KEEPALIVE_KEY en el repo."
            exit 1
          fi

          url='https://vdtrfqvflagnydpyusan.supabase.co/rest/v1/gift_codes?select=code&limit=1'

          # --fail-with-body para que un 4xx/5xx tumbe el job y GitHub avise por
          # email: un keepalive que falla en silencio no sirve de nada.
          status=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_KEY" \
            "$url")

          echo "HTTP $status - proyecto Supabase despierto."
