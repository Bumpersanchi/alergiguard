name: Supabase keep-alive

# Mantiene despierto el proyecto de Supabase "alergiguard" (canje remoto de
# codigos de regalo). Si lo encuentra pausado, lo RESTAURA solo: el 7-ago-2026 se
# pauso y el ping no podia despertarlo (Supabase le quita el DNS al subdominio,
# asi que curl fallaba con exit 6 sin llegar a nadie).
#
# Requiere el secreto SUPABASE_ACCESS_TOKEN (token personal de Supabase,
# https://supabase.com/dashboard/account/tokens). Sin el, el workflow sigue
# haciendo ping y avisando, pero no puede restaurar.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: vdtrfqvflagnydpyusan
      SUPABASE_URL: https://vdtrfqvflagnydpyusan.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_SYRjyLbENZWZLg5Saa1IRw_U9jJhk1V
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Ping, y restaurar el proyecto si esta pausado
        run: |
          # Llama a la RPC con un codigo inexistente (no-op) y devuelve el codigo
          # HTTP; 000 = ni siquiera resolvio el host (proyecto pausado).
          ping_rpc() {
            curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/redeem_gift_code" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"p_code":"__KEEPALIVE_NOOP__"}' \
              --max-time 30 -o response.txt -w '%{http_code}' || echo "000"
          }

          HTTP=$(ping_rpc)
          echo "Ping inicial: HTTP $HTTP - $(head -c 200 response.txt 2>/dev/null)"
          if [ "$HTTP" = "200" ]; then
            echo "Proyecto despierto. Nada que hacer."
            exit 0
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::El proyecto no responde (HTTP $HTTP) y no hay SUPABASE_ACCESS_TOKEN para restaurarlo"
            exit 1
          fi

          STATUS=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" --max-time 30 \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Estado segun la Management API: ${STATUS:-desconocido}"

          if [ "$STATUS" = "ACTIVE_HEALTHY" ]; then
            echo "::error::Supabase dice que esta activo pero la RPC responde $HTTP - mirar a mano"
            exit 1
          fi

          echo "Restaurando el proyecto..."
          curl -sS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d '{}' --max-time 60 \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" || true

          # Arrancar tarda un par de minutos, y ademas PostgREST cachea el esquema:
          # justo tras el arranque la RPC contesta 404 PGRST202 durante un rato.
          for i in $(seq 1 20); do
            sleep 30
            HTTP=$(ping_rpc)
            echo "  reintento $i: HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "::notice::Proyecto restaurado y respondiendo tras $((i*30))s"
              exit 0
            fi
          done

          echo "::error::Restauracion lanzada pero la RPC sigue sin responder 200 (ultimo: $HTTP)"
          exit 1
